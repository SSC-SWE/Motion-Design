<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pop on the Beat — Motion Lab</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 48px;
      }
      #hero {
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: #ffb070;
        will-change: transform;
      }
      #caption {
        color: #f4f4f5;
        opacity: 0.45;
        font-family: system-ui, sans-serif;
        font-size: 40px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1920"
      data-height="1080"
    >
      <section id="scene-hero" class="clip" data-start="0" data-duration="4">
        <div id="hero"></div>
        <div id="caption">Pop on the beat · 120 BPM · 24 fps</div>
      </section>
    </div>
    <script>
      // Deterministic: no clock, no Math.random. Beat grid = 120 BPM at 24 fps = 12 frames = 0.5 s.
      // "Make it pop" as a number: scale 1.0 -> 1.08 -> 1.0, one 6-frame pulse per beat.
      // Each pulse is a single yoyo tween (ease-out up, ease-in down). Loop closes: scale at
      // t=0 equals scale at t=4, so frame 96 == frame 0.
      const tl = gsap.timeline({ paused: true });
      const beat = 0.5; // 120 BPM at 24 fps
      const half = beat / 4; // 6 frames at 24 fps = 0.125 s
      for (let b = 0; b < 8; b++) {
        const t = b * beat;
        // One tween, two keyframes: ease-out up to the peak, ease-in back down.
        tl.to(
          "#hero",
          {
            keyframes: [
              { scale: 1.08, duration: half, ease: "power2.out" },
              { scale: 1.0, duration: half, ease: "power2.in" }
            ]
          },
          t
        );
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
